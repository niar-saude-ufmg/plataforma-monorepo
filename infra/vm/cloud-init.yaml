#cloud-config
package_update: true

packages:
  - git
  - curl
  - ca-certificates
  - dnf-plugins-core

runcmd:
  - dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
  - dnf remove -y podman-docker || true
  - dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker opc
  - su - opc -c 'export NVM_DIR="$HOME/.nvm" && if [ ! -s "$NVM_DIR/nvm.sh" ]; then curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash; fi'
  - su - opc -c 'export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && nvm install 22 && nvm alias default 22'
  - su - opc -c 'export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && nvm use 22 && npm install -g pnpm@11.19.0'
  - mkdir -p /home/opc/niar/plataforma
  - chown -R opc:opc /home/opc/niar

final_message: "NIAR platform VM bootstrap concluido. Reabra a sessao do usuario opc antes do primeiro deploy."
