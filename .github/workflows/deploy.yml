name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/niar-plataforma
          chmod 600 ~/.ssh/niar-plataforma
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to VM
        shell: bash
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'dist' \
            --exclude '.turbo' \
            --exclude '.pnpm-store' \
            --exclude '.local' \
            --exclude '.env.production' \
            -e "ssh -i ~/.ssh/niar-plataforma -p ${DEPLOY_PORT}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Upload production environment file
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/niar-plataforma -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          ssh -i ~/.ssh/niar-plataforma -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.production'" <<'EOF'
          ${PRODUCTION_ENV_FILE}
          EOF

      - name: Run deployment on VM
        shell: bash
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/niar-plataforma -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/infra/vm/deploy.sh' '$DEPLOY_PATH'"
