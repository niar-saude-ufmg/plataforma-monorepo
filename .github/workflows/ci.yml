name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/niar_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: niar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies and prepare workspace
        run: pnpm setup

      - name: Check monorepo
        run: pnpm check

      - name: Build monorepo
        run: pnpm build

      - name: Prepare integration database
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:apply:sql

      - name: Run tests
        run: pnpm test --env-mode=loose

      - name: Test assistant API
        working-directory: apps/assistente-api
        run: |
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pytest -q
