server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do Caddy (TLS): redirects relativos, para /about -> /about/ não
    # virar http://host:80/about/.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Site prerenderizado (adapter-static, trailingSlash 'always'): cada rota é
    # uma pasta com index.html. Não há fallback de SPA; rota inexistente é 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets com hash no nome: podem ficar em cache indefinidamente.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
