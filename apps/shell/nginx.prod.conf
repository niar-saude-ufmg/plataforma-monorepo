server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /identidade-visual {
        return 301 /identidade-visual/;
    }

    location /identidade-visual/ {
        try_files $uri $uri/ /identidade-visual/index.html;
    }

    location = /storybook {
        return 404;
    }

    location /storybook/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
