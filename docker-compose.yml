services:
  postgres:
    image: postgres:16-alpine
    container_name: niar-plataforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: niar_plataforma
      POSTGRES_USER: niar
      POSTGRES_PASSWORD: niar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niar -d niar_plataforma"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
