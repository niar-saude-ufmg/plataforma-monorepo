services:
  mysql:
    image: mysql:8.4
    container_name: niar-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: niar_admin
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: niar
      MYSQL_PASSWORD: niar
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
